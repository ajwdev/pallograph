[package]
name = "pallograph"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "pallograph"

# Release optimizations plus debug symbols, for profiling with samply.
[profile.profiling]
inherits = "release"
debug = true

[build-dependencies]
mangle-ast    = { git = "https://codeberg.org/TauCeti/mangle-rs", rev = "3ce2b034dda232d5a160b49bfc6b9a56fbe39087" }
mangle-driver = { git = "https://codeberg.org/TauCeti/mangle-rs", rev = "3ce2b034dda232d5a160b49bfc6b9a56fbe39087" }
glob          = "0.3"

[dependencies]
mangle-ast         = { git = "https://codeberg.org/TauCeti/mangle-rs", rev = "3ce2b034dda232d5a160b49bfc6b9a56fbe39087" }
mangle-parse       = { git = "https://codeberg.org/TauCeti/mangle-rs", rev = "3ce2b034dda232d5a160b49bfc6b9a56fbe39087" }
mangle-common      = { git = "https://codeberg.org/TauCeti/mangle-rs", rev = "3ce2b034dda232d5a160b49bfc6b9a56fbe39087" }
mangle-driver      = { git = "https://codeberg.org/TauCeti/mangle-rs", rev = "3ce2b034dda232d5a160b49bfc6b9a56fbe39087" }
mangle-interpreter = { git = "https://codeberg.org/TauCeti/mangle-rs", rev = "3ce2b034dda232d5a160b49bfc6b9a56fbe39087" }
mangle-analysis    = { git = "https://codeberg.org/TauCeti/mangle-rs", rev = "3ce2b034dda232d5a160b49bfc6b9a56fbe39087" }
mangle-ir          = { git = "https://codeberg.org/TauCeti/mangle-rs", rev = "3ce2b034dda232d5a160b49bfc6b9a56fbe39087" }

serde       = { version = "1", features = ["derive", "rc"] }
serde_json  = { version = "1", features = ["preserve_order"] }
serde_yaml  = "0.9"
toml        = "0.8"
dirs        = "5"
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
rustyline   = "14"
glob        = "0.3"
kube        = { version = "4.2", features = ["client", "runtime"] }
k8s-openapi = { version = "0.28", features = ["v1_36"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
futures     = "0.3"
self_cell = "1.2.2"
differential-dataflow = "0.23.0"
timely = "0.29.0"
crossbeam-channel = "0.5"
z3 = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Used by integration tests (tests/) to construct `Value` fixtures.
mangle-common = { git = "https://codeberg.org/TauCeti/mangle-rs", rev = "3ce2b034dda232d5a160b49bfc6b9a56fbe39087" }

[[bench]]
name = "small_bulk_load"
harness = false

[[bench]]
name = "small_fact_update"
harness = false

[[bench]]
name = "medium_bulk_load"
harness = false

[[bench]]
name = "medium_fact_update"
harness = false

[[bench]]
name = "small_provenance"
harness = false

[[bench]]
name = "medium_provenance"
harness = false

[[bench]]
name = "smt_access"
harness = false

[features]
z3-static = ["z3/static-link-z3"]
