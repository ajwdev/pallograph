# Referenced by pods below — should NOT appear in orphaned_sa results.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: used-sa
  namespace: pallograph-test
---
# Never referenced by any pod — SHOULD appear in orphaned_sa results.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orphaned-sa
  namespace: pallograph-test
---
# Bound to cluster-admin below — SHOULD appear in sa_is_cluster_admin results.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-sa
  namespace: pallograph-test
