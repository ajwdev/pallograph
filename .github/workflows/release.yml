name: Release

# A v* tag publishes binaries to a GitHub Release and the image to GHCR.
# workflow_dispatch builds everything without publishing (a dry run).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#static
      - name: Check the binary is static and runs
        run: |
          file -L result/bin/pallograph | tee /dev/stderr | grep -q 'statically linked'
          ./result/bin/pallograph --version
      - name: Package
        run: |
          name=pallograph-${GITHUB_REF_NAME}-${{ matrix.arch }}-unknown-linux-musl
          mkdir -p "dist/$name"
          cp result/bin/pallograph LICENSE-APACHE LICENSE-MIT README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Native runner per architecture: building under QEMU would take hours.
  # Each pushes by digest and the manifest job joins them under one tag.
  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error

  manifest:
    # After release, so a tag that fails the version check never moves :latest.
    needs: [image, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Create multi-arch manifest
        working-directory: digests
        run: |
          # shellcheck disable=SC2046 # word splitting is intended
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
